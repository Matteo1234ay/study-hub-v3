name: Fetch V25 Hero Asset

on:
  push:
    paths:
      - ".github/workflows/fetch-v25-hero-asset.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vendor pinned Three loader graph
        run: |
          npm ci
          node scripts/vendor-three.mjs
      - name: Fetch Poly Haven 1K glTF into local runtime assets
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          asset_id = "desk_lamp_arm_01"
          destination = pathlib.Path("assets/3d/desk-lamp-arm-01")
          destination.mkdir(parents=True, exist_ok=True)
          headers = {"User-Agent": "StudyHub-V25-local-asset-fetch"}

          def fetch(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          files = json.loads(fetch(f"https://api.polyhaven.com/files/{asset_id}"))
          node = (((files.get("gltf") or {}).get("1k") or {}).get("gltf"))
          if not isinstance(node, dict) or not node.get("url"):
              raise RuntimeError("Poly Haven 1K glTF record not found")

          def safe_relative(value):
              path = pathlib.PurePosixPath(value)
              if path.is_absolute() or ".." in path.parts:
                  raise RuntimeError(f"Unsafe include path: {value}")
              return pathlib.Path(*path.parts)

          primary_bytes = fetch(node["url"])
          primary_path = destination / f"{asset_id}_1k.gltf"
          primary_path.write_bytes(primary_bytes)

          includes = node.get("include") or {}
          for relative_name, record in includes.items():
              if not isinstance(record, dict) or not record.get("url"):
                  continue
              target = destination / safe_relative(relative_name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(fetch(record["url"]))

          all_files = [path for path in destination.rglob("*") if path.is_file()]
          total = sum(path.stat().st_size for path in all_files)
          if total > 8 * 1024 * 1024:
              raise RuntimeError(f"Hero asset exceeds 8 MB budget: {total}")
          if any("4k" in path.name.lower() for path in all_files):
              raise RuntimeError("Unexpected 4K file in V25 hero asset")
          print(f"Stored {len(all_files)} local files, {total} bytes")
          PY
      - name: Commit generated local files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/three assets/3d/desk-lamp-arm-01
          if git diff --cached --quiet; then
            echo "No generated files changed"
            exit 0
          fi
          git commit -m "chore: vendor V25 local hero asset"
          git push origin HEAD:main
