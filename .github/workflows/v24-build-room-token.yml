name: V24 build-room token patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v24-build-room-token.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch build-room cache tokens
        run: |
          sed -i 's/20260829-23/20260829-24/g' src/home/scene/build-room.js
          test "$(grep -o '20260829-23' src/home/scene/build-room.js | wc -l)" -eq 0
          grep -q 'screen-ui.js?v=20260829-24' src/home/scene/build-room.js
          grep -q 'RoundedBoxGeometry.js?v=20260829-24' src/home/scene/build-room.js
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v24-build-room-token.yml
          git add src/home/scene/build-room.js
          git commit -m 'chore: complete V24 build-room cache graph'
          git push origin HEAD:main
