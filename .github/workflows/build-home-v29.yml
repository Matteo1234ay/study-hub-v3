name: Build Home V29 Blender Asset

on:
  workflow_dispatch:
  push:
    branches: [feat/home-blender-first-v29]
    paths:
      - scripts/blender/build-home-v29.py
      - .github/workflows/build-home-v29.yml
      - tests/home-v29-assets.test.js
      - tests/home-v29-visual-contract.test.js
      - src/home/scene/home-v29-contract.js

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
          blender --background --python-expr "import numpy; print('Blender NumPy', numpy.__version__)"
      - name: Build V29 scene
        run: blender --background --python scripts/blender/build-home-v29.py
      - name: Inspect generated files
        run: |
          ls -lh assets/3d/home-v29/
          test -s assets/3d/home-v29/study-hub-home-v29.blend
          test -s assets/3d/home-v29/study-hub-home-v29.glb
      - name: Validate V29 asset and visual contract
        run: node --test tests/home-v29-assets.test.js tests/home-v29-visual-contract.test.js tests/home-v29-contract.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: study-hub-home-v29
          if-no-files-found: error
          retention-days: 7
          path: |
            assets/3d/home-v29/study-hub-home-v29.blend
            assets/3d/home-v29/study-hub-home-v29.glb
      - name: Commit verified Blender outputs
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/3d/home-v29/study-hub-home-v29.blend assets/3d/home-v29/study-hub-home-v29.glb
          if git diff --cached --quiet; then
            echo "V29 Blender outputs already match the committed files."
            exit 0
          fi
          git commit -m "feat: build verified v29 blender assets"
          git pull --rebase origin feat/home-blender-first-v29
          git push origin HEAD:feat/home-blender-first-v29
