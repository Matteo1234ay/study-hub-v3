name: Test

on:
  push:
    branches: [main, codex/study-hub-v3-core]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Check for committed secrets
        run: node scripts/check-secrets.mjs
