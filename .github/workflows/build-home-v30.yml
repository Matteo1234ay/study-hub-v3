name: Build Home V30 Blender Asset

on:
  workflow_dispatch:
  push:
    branches: [feat/home-v30-realistic-cc0]
    paths:
      - scripts/blender/build-home-v30.py
      - .github/workflows/build-home-v30.yml
      - tests/home-v30-blender-assets.test.js
      - tests/home-v30-blender-source.test.js
      - src/home/scene/home-v30-contract.js
      - assets/3d/home-v30/manifest.json
      - assets/3d/home-v30/vendor/**
      - assets/3d/desk-lamp-arm-01/**

permissions:
  contents: write

concurrency:
  group: home-v30-blender-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/home-v30-realistic-cc0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Build V30 scene
        run: blender --background --python scripts/blender/build-home-v30.py
      - name: Inspect generated files
        run: |
          ls -lh assets/3d/home-v30/study-hub-home-v30.blend assets/3d/home-v30/study-hub-home-v30.glb
          test -s assets/3d/home-v30/study-hub-home-v30.blend
          test -s assets/3d/home-v30/study-hub-home-v30.glb
          test "$(stat -c%s assets/3d/home-v30/study-hub-home-v30.glb)" -le 18874368
      - name: Validate V30 Blender contract
        run: node --test tests/home-v30-contract.test.js tests/home-v30-blender-source.test.js tests/home-v30-blender-assets.test.js tests/home-v30-assets.test.js
      - name: Check committed-source safety
        run: node scripts/check-secrets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: study-hub-home-v30-blender
          if-no-files-found: error
          retention-days: 7
          path: |
            assets/3d/home-v30/study-hub-home-v30.blend
            assets/3d/home-v30/study-hub-home-v30.glb
      - name: Commit verified Blender outputs
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/3d/home-v30/study-hub-home-v30.blend assets/3d/home-v30/study-hub-home-v30.glb
          if git diff --cached --quiet; then
            echo "V30 Blender outputs already match the committed files."
            exit 0
          fi
          git commit -m "feat: build verified v30 blender assets"
          git pull --rebase origin feat/home-v30-realistic-cc0
          git push origin HEAD:feat/home-v30-realistic-cc0
