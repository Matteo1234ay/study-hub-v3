<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gobbo</title>
<style>
:root{--bg:#050608;--panel:#11131a;--text:#f7f8fb;--muted:#9aa3b2;--accent:#4f7cff;--font:72px;--speed:72}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,textarea{font:inherit}button{touch-action:manipulation}.hidden{display:none!important}.screen{min-height:100svh}.home,.setup{padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.home{display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#17213d 0,#080a10 40%,#050608 75%)}.card,.setupCard{width:min(760px,100%);margin:auto;background:rgba(17,19,26,.96);border:1px solid #272b35;border-radius:24px;padding:clamp(20px,5vw,38px)}h1{font-size:clamp(38px,8vw,68px);line-height:.98;margin:10px 0 14px;letter-spacing:-.04em}.brand{font-size:13px;font-weight:800;letter-spacing:.26em;color:#9db2ff}.sub{color:var(--muted);line-height:1.5}.drop{display:grid;place-items:center;text-align:center;gap:8px;min-height:130px;margin:24px 0 14px;border:1.5px dashed #424959;border-radius:18px;background:#0a0c11;cursor:pointer;padding:16px}.drop input{display:none}.drop strong{font-size:20px}.drop span,.or{color:var(--muted);font-size:14px}.or{text-align:center;margin:10px}.card textarea{display:block;width:100%;min-height:170px;resize:vertical;border:1px solid #2a2f3a;border-radius:16px;background:#090b10;color:white;padding:16px;font-size:16px;line-height:1.5}.primary,.ghost,.mode{cursor:pointer}.primary{width:100%;border:0;border-radius:14px;background:var(--accent);color:white;font-weight:800;padding:15px 18px;margin-top:14px;min-height:50px}.error{min-height:20px;color:#ff7a7a;font-size:14px}.setup{background:#090b10}.setup header{max-width:900px;margin:0 auto 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.ghost{border:1px solid #343a46;border-radius:12px;background:transparent;color:white;padding:10px 14px;min-height:44px}.docname{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw}.setupCard{max-width:900px}.setupCard h2{font-size:clamp(30px,7vw,44px);margin:0 0 22px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{min-height:120px;text-align:left;border:1px solid #2d323d;border-radius:16px;background:#14171e;color:white;padding:18px}.mode strong{display:block;font-size:21px;margin-bottom:6px}.mode span{color:var(--muted)}.mode.selected{outline:2px solid var(--accent);background:#12192b}.settings{display:grid;gap:18px;margin:24px 0}.settings label{display:grid;grid-template-columns:1fr auto;gap:8px}.settings input{grid-column:1/-1;width:100%}.toggle{display:flex;align-items:center;gap:10px}.toggle input{width:20px;height:20px}.prompter{position:fixed;inset:0;background:#000;overflow:hidden}.mirror{position:absolute;inset:0;overflow:hidden}.mirror.on{transform:scaleX(-1)}.continuous{position:absolute;left:max(5vw,env(safe-area-inset-left));right:max(5vw,env(safe-area-inset-right));top:52%;font-size:clamp(30px,min(var(--font),9vw),var(--font));line-height:1.3;font-weight:650;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;will-change:transform;padding-bottom:70vh}.phraseWrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:max(22px,env(safe-area-inset-top)) max(5vw,env(safe-area-inset-right)) max(120px,calc(env(safe-area-inset-bottom) + 100px)) max(5vw,env(safe-area-inset-left))}.phrase{width:100%;max-width:1400px;overflow-wrap:anywhere}.phrase.current{font-size:clamp(30px,min(var(--font),9vw),var(--font));font-weight:760;line-height:1.15}.phrase.dim{font-size:clamp(22px,min(calc(var(--font)*.58),6vw),54px);opacity:.18}.controls{position:absolute;z-index:20;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;width:min(96%,760px);padding:7px;border-radius:16px;background:rgba(20,22,27,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.controls button{min-width:44px;height:44px;border:1px solid #3a404a;border-radius:10px;background:#191c22;color:white;padding:0 10px}.controls .play{background:white;color:black;font-weight:900}.grp{display:flex;align-items:center;gap:5px}.grp b{min-width:30px;text-align:center}.count{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:#000;font-size:min(36vw,360px);font-weight:900}
@media(max-width:700px){.modes{grid-template-columns:1fr}.controls{width:calc(100% - 12px)}.controls button{min-width:46px;height:46px}.grp span{display:none}.continuous{left:5vw;right:5vw;line-height:1.25}.card,.setupCard{border-radius:20px}}
@media(max-height:520px) and (orientation:landscape){.continuous,.phrase.current{font-size:clamp(26px,min(var(--font),7vw),64px)}.phrase.dim{display:none}.controls button{height:40px;min-width:40px}}
@media(pointer:coarse){.controls{opacity:1}.primary,.ghost,.mode{min-height:48px}}
</style>
</head>
<body>
<main id="home" class="screen home"><section class="card"><div class="brand">GOBBO</div><h1>Il tuo script, davanti agli occhi.</h1><p class="sub">Funziona direttamente nel browser. Il testo e i file restano sul dispositivo: non vengono caricati online.</p><label class="drop"><input id="fileInput" type="file" accept=".txt,.md,.docx,.pdf,text/plain,text/markdown,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><strong>Carica uno script</strong><span>TXT · MD · DOCX · PDF</span></label><div class="or">oppure</div><textarea id="paste" placeholder="Scrivi o incolla qui lo script…"></textarea><button id="usePaste" class="primary">Usa questo testo</button><p id="error" class="error" aria-live="polite"></p></section></main>
<main id="setup" class="screen setup hidden"><header><button id="back" class="ghost">← Cambia script</button><div id="docName" class="docname"></div></header><section class="setupCard"><h2>Come vuoi leggerlo?</h2><div class="modes"><button class="mode selected" data-mode="continuous"><strong>Scorrimento</strong><span>Il testo sale in modo continuo</span></button><button class="mode" data-mode="phrases"><strong>Frase per frase</strong><span>Una frase alla volta</span></button></div><div class="settings"><label>Velocità <output id="speedOut">72</output><input id="speed" type="range" min="40" max="180" step="2" value="72"></label><label>Dimensione testo <output id="fontOut">72</output><input id="font" type="range" min="36" max="128" value="72"></label><label>Testo visibile <output id="densityOut">3 righe</output><input id="density" type="range" min="1" max="6" value="3"></label></div><label class="toggle"><input id="mirrorSetup" type="checkbox">Modalità specchio</label><button id="start" class="primary">Avvia gobbo</button></section></main>
<main id="prompter" class="prompter hidden"><div id="mirror" class="mirror"><div id="continuous" class="continuous"></div><div id="phraseWrap" class="phraseWrap hidden"><div id="prevPhrase" class="phrase dim"></div><div id="currentPhrase" class="phrase current"></div><div id="nextPhrase" class="phrase dim"></div></div></div><div id="count" class="count hidden"></div><div class="controls"><button id="exit">✕</button><button id="restart" title="Ricomincia">↺</button><button id="prev">◀</button><button id="play" class="play">▶</button><button id="next">▶</button><div class="grp"><span>Vel</span><button id="speedDown">−</button><b id="speedLive">72</b><button id="speedUp">+</button></div><div class="grp"><span>Testo</span><button id="fontDown">A−</button><button id="fontUp">A+</button></div><button id="mirrorBtn">⇋</button><button id="full">⛶</button></div></main>
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
let text='',phrases=[],mode='continuous',speed=72,fontSize=72,density=3,mirrored=false,playing=false,raf=0,last=0,scrollY=0,phraseIndex=0;
const screens={home:$('#home'),setup:$('#setup'),prompter:$('#prompter')};function show(n){Object.entries(screens).forEach(([k,v])=>v.classList.toggle('hidden',k!==n))}function error(m=''){$('#error').textContent=m}function clean(s){return s.replace(/\r/g,'').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').replace(/[ \t]{2,}/g,' ').trim()}function split(s){return (s.match(/[^.!?…\n]+(?:[.!?…]+[”’"']?|\n+|$)/g)||[s]).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean)}
function load(t,n){text=clean(t);if(!text)return error('Non ho trovato testo leggibile.');phrases=split(text);$('#docName').textContent=n||'Testo';error();show('setup')}
function save(){try{localStorage.gobbo=JSON.stringify({speed,fontSize,density,mirrored})}catch(_){}}function restore(){try{const s=JSON.parse(localStorage.gobbo||'{}');speed=s.speed||72;fontSize=s.fontSize||72;density=s.density||3;mirrored=!!s.mirrored}catch(_){}}function apply(){document.documentElement.style.setProperty('--font',fontSize+'px');$('#speed').value=speed;$('#speedOut').textContent=speed;$('#speedLive').textContent=speed;$('#font').value=fontSize;$('#fontOut').textContent=fontSize;$('#density').value=density;$('#densityOut').textContent=density+(density===1?' riga':' righe');$('#mirrorSetup').checked=mirrored;$('#mirror').classList.toggle('on',mirrored)}restore();apply();
function u16(v,o){return v.getUint16(o,true)}function u32(v,o){return v.getUint32(o,true)}async function inflateRaw(bytes){if(!window.DecompressionStream)throw Error('DOCX non supportato da questo browser. Prova Safari/Chrome aggiornato oppure incolla il testo.');const ds=new DecompressionStream('deflate-raw');return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer())}
async function docx(buf){const b=new Uint8Array(buf),v=new DataView(buf);let e=-1;for(let i=b.length-22;i>=Math.max(0,b.length-65557);i--)if(u32(v,i)===0x06054b50){e=i;break}if(e<0)throw Error('DOCX non valido.');let p=u32(v,e+16),entries=u16(v,e+10),t=null;for(let n=0;n<entries;n++){if(u32(v,p)!==0x02014b50)break;const method=u16(v,p+10),size=u32(v,p+20),nl=u16(v,p+28),xl=u16(v,p+30),cl=u16(v,p+32),lo=u32(v,p+42),name=new TextDecoder().decode(b.slice(p+46,p+46+nl));if(name==='word/document.xml')t={method,size,lo};p+=46+nl+xl+cl}if(!t)throw Error('Non trovo il testo nel DOCX.');const nl=u16(v,t.lo+26),xl=u16(v,t.lo+28),st=t.lo+30+nl+xl;let d=b.slice(st,st+t.size);if(t.method===8)d=await inflateRaw(d);const xml=new TextDecoder().decode(d),doc=new DOMParser().parseFromString(xml,'application/xml');let out='';doc.querySelectorAll('w\\:p,p').forEach(p=>{let line='';p.querySelectorAll('w\\:t,t').forEach(t=>line+=t.textContent);if(line.trim())out+=line.trim()+'\n\n'});return out}
function findAscii(b,n,start=0){const q=new TextEncoder().encode(n);outer:for(let i=start;i<=b.length-q.length;i++){for(let j=0;j<q.length;j++)if(b[i+j]!==q[j])continue outer;return i}return-1}function pdfOps(s){let o=[];for(const m of s.matchAll(/\((?:\\.|[^\\)])*\)\s*Tj/g))o.push(m[0].replace(/\)\s*Tj$/,'').slice(1));for(const m of s.matchAll(/\[(.*?)\]\s*TJ/gs)){let x='';for(const z of m[1].matchAll(/\((?:\\.|[^\\)])*\)/g))x+=z[0].slice(1,-1);if(x)o.push(x)}return o.join(' ')}async function pdf(buf){const b=new Uint8Array(buf);let pos=0,ch=[];while(true){const s=findAscii(b,'stream',pos);if(s<0)break;let st=s+6;if(b[st]===13&&b[st+1]===10)st+=2;else if(b[st]===10)st++;const e=findAscii(b,'endstream',st);if(e<0)break;let raw=b.slice(st,e),dec=null;try{if(window.DecompressionStream){const ds=new DecompressionStream('deflate');dec=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer())}}catch(_){}const t=pdfOps(new TextDecoder('latin1').decode(dec||raw));if(t)ch.push(t);pos=e+9}const r=ch.join('\n\n').replace(/\s+/g,' ').trim();if(!r)throw Error('PDF non leggibile direttamente. Se è una scansione, incolla il testo.');return r}
async function readFile(f){const ext=(f.name.split('.').pop()||'').toLowerCase();if(ext==='txt'||ext==='md')return f.text();if(ext==='docx')return docx(await f.arrayBuffer());if(ext==='pdf')return pdf(await f.arrayBuffer());throw Error('Formato non supportato.')}$('#fileInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{load(await readFile(f),f.name)}catch(err){error(err.message)}});$('#usePaste').onclick=()=>load($('#paste').value,'Testo incollato');$('#back').onclick=()=>show('home');
$$('.mode').forEach(b=>b.onclick=()=>{$$('.mode').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');mode=b.dataset.mode});$('#speed').oninput=e=>{speed=+e.target.value;apply();save()};$('#font').oninput=e=>{fontSize=+e.target.value;apply();save()};$('#density').oninput=e=>{density=+e.target.value;apply();save()};$('#mirrorSetup').onchange=e=>{mirrored=e.target.checked;apply();save()};
function renderPhrase(){const span=Math.max(1,Math.round(density/2));$('#prevPhrase').textContent=phrases.slice(Math.max(0,phraseIndex-span),phraseIndex).join(' ');$('#currentPhrase').textContent=phrases[phraseIndex]||'';$('#nextPhrase').textContent=phrases.slice(phraseIndex+1,phraseIndex+1+span).join(' ')}function prep(){playing=false;cancelAnimationFrame(raf);last=0;scrollY=0;phraseIndex=0;$('#play').textContent='▶';$('#continuous').style.transform='translateY(0)';$('#continuous').textContent=text;$('#continuous').classList.toggle('hidden',mode!=='continuous');$('#phraseWrap').classList.toggle('hidden',mode!=='phrases');renderPhrase();apply();show('prompter')}async function countdown(){const c=$('#count');c.classList.remove('hidden');for(const n of [3,2,1]){c.textContent=n;await new Promise(r=>setTimeout(r,600))}c.classList.add('hidden');toggle(true)}$('#start').onclick=()=>{prep();countdown()};function toggle(force){playing=force===undefined?!playing:force;$('#play').textContent=playing?'❚❚':'▶';last=0;if(playing&&mode==='continuous')raf=requestAnimationFrame(tick)}function tick(ts){if(!playing||mode!=='continuous')return;if(!last)last=ts;scrollY+=speed*((ts-last)/1000);last=ts;$('#continuous').style.transform=`translateY(${-scrollY}px)`;if(scrollY>$('#continuous').scrollHeight+innerHeight*.1){playing=false;$('#play').textContent='▶';return}raf=requestAnimationFrame(tick)}function step(d){if(mode==='phrases'){phraseIndex=Math.max(0,Math.min(phrases.length-1,phraseIndex+d));renderPhrase()}else{scrollY=Math.max(0,scrollY+d*innerHeight*.35);$('#continuous').style.transform=`translateY(${-scrollY}px)`}}function restart(){playing=false;cancelAnimationFrame(raf);last=0;scrollY=0;phraseIndex=0;$('#play').textContent='▶';$('#continuous').style.transform='translateY(0)';renderPhrase()}$('#restart').onclick=restart;$('#play').onclick=()=>toggle();$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);$('#speedDown').onclick=()=>{speed=Math.max(40,speed-6);apply();save()};$('#speedUp').onclick=()=>{speed=Math.min(180,speed+6);apply();save()};$('#fontDown').onclick=()=>{fontSize=Math.max(36,fontSize-6);apply();save()};$('#fontUp').onclick=()=>{fontSize=Math.min(128,fontSize+6);apply();save()};$('#mirrorBtn').onclick=()=>{mirrored=!mirrored;apply();save()};$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('#exit').onclick=()=>{playing=false;cancelAnimationFrame(raf);show('setup')};
window.addEventListener('keydown',e=>{if(screens.prompter.classList.contains('hidden'))return;if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowRight'||e.key==='ArrowDown')step(1);else if(e.key==='ArrowLeft'||e.key==='ArrowUp')step(-1);else if(e.key==='+'||e.key==='=')$('#speedUp').click();else if(e.key==='-')$('#speedDown').click();else if(e.key.toLowerCase()==='m')$('#mirrorBtn').click();else if(e.key.toLowerCase()==='f')$('#full').click()});
</script>
</body></html>
