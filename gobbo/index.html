<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Gobbo</title><link rel="stylesheet" href="style.css?v=20260902-ocr"></head><body><main id="home" class="screen home"><section class="card"><div class="brand">GOBBO</div><h1>Il tuo script, davanti agli occhi.</h1><p class="sub">Il documento resta sul dispositivo. PDF normali e scansioni vengono letti automaticamente.</p><label class="drop"><input id="fileInput" type="file" accept=".txt,.md,.docx,.pdf,text/plain,text/markdown,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><strong>Carica uno script</strong><span>TXT · MD · DOCX · PDF · anche scansioni con OCR</span></label><div class="or">oppure</div><textarea id="paste" placeholder="Scrivi o incolla qui lo script…"></textarea><button id="usePaste" class="primary">Usa questo testo</button><p id="error" class="error" aria-live="polite"></p></section></main><main id="setup" class="screen setup hidden"><header><button id="back" class="ghost">← Cambia script</button><div id="docName" class="docname"></div></header><section class="setupCard"><h2>Come vuoi leggerlo?</h2><div class="modes"><button class="mode selected" data-mode="continuous"><strong>Scorrimento</strong><span>Il testo sale in modo continuo</span></button><button class="mode" data-mode="phrases"><strong>Frase per frase</strong><span>Una frase alla volta</span></button></div><div class="settings"><label>Velocità <output id="speedOut">72</output><input id="speed" type="range" min="40" max="180" step="2" value="72"></label><label>Dimensione testo <output id="fontOut">72</output><input id="font" type="range" min="36" max="128" value="72"></label><label>Testo visibile <output id="densityOut">3 righe</output><input id="density" type="range" min="1" max="6" value="3"></label></div><label class="toggle"><input id="mirrorSetup" type="checkbox">Modalità specchio</label><button id="start" class="primary">Avvia gobbo</button></section></main><main id="prompter" class="prompter hidden"><div id="mirror" class="mirror"><div id="continuous" class="continuous"></div><div id="phraseWrap" class="phraseWrap hidden"><div id="prevPhrase" class="phrase dim"></div><div id="currentPhrase" class="phrase current"></div><div id="nextPhrase" class="phrase dim"></div></div></div><div id="count" class="count hidden"></div><div class="controls"><button id="exit">✕</button><button id="restart" title="Ricomincia">↺</button><button id="prev">◀</button><button id="play" class="play">▶</button><button id="next">▶</button><button id="speedDown">−Vel</button><b id="speedLive">72</b><button id="speedUp">+Vel</button><button id="fontDown">A−</button><button id="fontUp">A+</button><button id="mirrorBtn">⇋</button><button id="full">⛶</button></div></main><script src="app.js?v=20260902-ocr"></script></body></html>
